version: '3.8'

services:
  # 1. Головна база даних
  db:
    image: postgres:16-alpine  # Використовуємо легку Alpine версію
    container_name: onix_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}      # REQUIRED - no default
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}  # REQUIRED - no default
      POSTGRES_DB: ${DB_NAME:-onix_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-onix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Зручна адмінка (Опційно)
  pgweb:
    image: sosedoff/pgweb
    container_name: onix_pgweb
    restart: always
    environment:
      PGWEB_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME:-onix_db}?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:  # Оголошуємо волюм для збереження даних