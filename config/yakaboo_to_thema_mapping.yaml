# Tag-based mappings for additional classification
tags:
  # Age groups
  age_0_3:
    thema_codes: ["5A"]  # For pre-school (0-5 years)
  age_3_6:
    thema_codes: ["5A"]  # For pre-school (0-5 years)
  age_6_9:
    thema_codes: ["5AF"] # For early years (6-8)
  age_9_12:
    thema_codes: ["5AH"] # For older readers (9-11)
  age_12_plus:
    thema_codes: ["5AK"] # For young adults (12+ years)

  # Format types
  hardcover:
    thema_codes: []  # Format is handled by ONIX ProductForm
  paperback:
    thema_codes: []  # Format is handled by ONIX ProductForm
  ebook:
    thema_codes: []  # Format is handled by ONIX ProductForm
  audiobook:
    thema_codes: []  # Format is handled by ONIX ProductForm

  # Special features
  illustrated:
    thema_codes: ["AK"]   # Illustration & commercial art
  bestseller:
    thema_codes: []       # Use sales ranking instead
  new_release:
    thema_codes: []       # Use publication date instead
  
  # Language tags
  ukrainian:
    language_code: "ukr"  # ISO 639-2
  english:
    language_code: "eng"  # ISO 639-2
  russian:
    language_code: "rus"  # ISO 639-2

# Special mappings for complex categorization
genre_mappings:
  # Ukrainian literature
  ukrainian_classics:
    thema_codes:
      - "FCC"    # Classic fiction (pre c 1900)
      - "2AGSV"  # Ukrainian (language qualifier)
    
  ukrainian_contemporary:
    thema_codes:
      - "FA"     # Modern & contemporary fiction
      - "2AGSV"  # Ukrainian (language qualifier)

  # World literature by region
  american_literature:
    thema_codes: ["FBA"]  # Modern & contemporary fiction: American
  british_literature:
    thema_codes: ["FBD"]  # Modern & contemporary fiction: British & Irish
  european_literature:
    thema_codes: ["FBC"]  # Modern & contemporary fiction: European

  # Non-fiction subjects
  biography_arts:
    thema_codes: ["AVGB"] # Biography: arts & entertainment
  biography_business:
    thema_codes: ["BGBA"] # Biography: business & industry
  biography_science:
    thema_codes: ["DNBS"] # Biography: science, technology & medicine

# Priority levels explanation:
# 1 = Primary subject (main category)
# 2 = Secondary subject (additional context)
# 3 = Tertiary subject (format/accessory classification)

# Usage notes:
# - Multiple THEMA codes can be assigned to a single category
# - Subcategories inherit parent codes and add specific ones
# - Priority determines order in ONIX Subject elements
# - Combine category + tag codes for precise classification
